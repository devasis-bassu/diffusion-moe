defaults:
  - model: 300m
  - experiment: default
  - _self_

data:
  dataset: "the_pile"
  tokenizer: "mistralai/Mistral-7B-v0.1"
  max_seq_len: 2048
  batch_size: 8
  num_workers: 4
  prefetch_factor: 2
  val_tokens: 5_000_000
  # Local parquet file path(s) to read --dataset's train split from directly,
  # bypassing Hub streaming -- a recurring flaky-CDN stall hit repeatedly
  # across this investigation. null by default (stream from the Hub as usual).
  local_data_files: null

routing:
  n_experts: 8
  top_k: 2
  tau: 0.1
  n_components: 32
  n_landmarks: 128
  diffusion_t: 3
  alpha: 1.0
  # Measured directly, not guessed: on a freshly (correctly) initialized
  # model, task_loss's raw gradient pull on the shared ExpertCentroids
  # parameter is only ~1.86x load_loss's raw pull -- a fair fight. The old
  # mu_load=0.01 shrank that to an effective ~186x, leaving load_loss
  # almost no ability to resist collapse -- very likely tuned against the
  # old, catastrophically-mis-scaled task_loss (see moe_model.py's
  # embedding/residual-init fix) and never revisited once that was fixed.
  # 2.0 targets an effective ratio near 1 (roughly balanced pull), not
  # load_loss dominating outright.
  mu_load: 2.0
  nu_sep: 0.05
  centroid_refresh_steps: 500
  centroid_max_radius_factor: 3.0
  # Gaussian noise added to router logits during training only (noisy top-k
  # gating, Shazeer et al. 2017) -- 0.0 = off. If set, scale relative to
  # `tau` above: raw noise_std is divided by tau in the actual softmax, so
  # e.g. noise_std=0.1 at tau=0.1 lands at an effective magnitude of ~1, a
  # reasonable starting point (phase1_findings_report.md §3.5 -- a first
  # attempt 10x too strong made router collapse measurably worse, not better).
  noise_std: 0.0

training:
  total_tokens: 30_000_000_000
  lr: 3.0e-4
  weight_decay: 0.1
  warmup_steps: 2000
  grad_clip: 1.0
  grad_accum_steps: 4
  precision: "bf16"
  checkpoint_steps: 5000
  eval_steps: 1000
  log_steps: 50
  # Numbered checkpoints (step_N.pt) beyond the most recent N are deleted
  # automatically after each save -- otherwise they accumulate forever and
  # can fill the disk mid-run (a real crash: 8 checkpoints x ~5.7GB each on
  # a 60GB instance killed training right at its second-to-last step).
  # best.pt is separate and always kept. <= 0 = unlimited retention (the
  # old, unbounded behavior), opt-in.
  keep_last_n_checkpoints: 2

wandb:
  project: "diffusion-moe"
  entity: null
  mode: "online"

seed: 42
resume_from_checkpoint: null
# null = every layer is a DiffusionMoELayer; a list of layer indices (e.g.
# [0, 2]) replaces only those layers for ablations (Section 11), leaving the
# rest as dense TransformerBlocks. Must match between a training run and any
# later evaluate.py/model_factory reconstruction of the same checkpoint.
layers_to_replace: null
# Which of the replaced layers fit their diffusion map on L2-normalized
# (cosine) activations instead of raw ones -- null/empty = none (matches
# this project's own 32-layer finding, phase1_findings_report.md §2.4/§7
# recommendation 2: cosine is NOT a uniform improvement, only a fix for
# specific layers that never connect under raw Euclidean at any bandwidth).
# Indices outside layers_to_replace are simply inert. For Mistral-7B those
# layers were 17, 20, 31 -- this project's own from-scratch architecture
# hasn't been mapped the same way yet (see recommendation 3's caveat).
cosine_layers: null
