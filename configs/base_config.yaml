defaults:
  - model: 300m
  - experiment: default
  - _self_

data:
  dataset: "the_pile"
  tokenizer: "mistralai/Mistral-7B-v0.1"
  max_seq_len: 2048
  batch_size: 8
  num_workers: 4
  prefetch_factor: 2
  val_tokens: 5_000_000

routing:
  n_experts: 8
  top_k: 2
  tau: 0.1
  n_components: 32
  n_landmarks: 128
  diffusion_t: 3
  alpha: 1.0
  mu_load: 0.01
  nu_sep: 0.05
  centroid_refresh_steps: 500

training:
  total_tokens: 30_000_000_000
  lr: 3.0e-4
  weight_decay: 0.1
  warmup_steps: 2000
  grad_clip: 1.0
  grad_accum_steps: 4
  precision: "bf16"
  checkpoint_steps: 5000
  eval_steps: 1000
  log_steps: 50

wandb:
  project: "diffusion-moe"
  entity: null
  mode: "online"

seed: 42
resume_from_checkpoint: null
# null = every layer is a DiffusionMoELayer; a list of layer indices (e.g.
# [0, 2]) replaces only those layers for ablations (Section 11), leaving the
# rest as dense TransformerBlocks. Must match between a training run and any
# later evaluate.py/model_factory reconstruction of the same checkpoint.
layers_to_replace: null
